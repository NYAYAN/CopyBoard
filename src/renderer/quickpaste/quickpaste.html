<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyBoard Hızlı Yapıştır</title>
    <link rel="stylesheet" href="quickpaste.css">
</head>

<body>
    <div class="qp-panel">
        <div class="qp-header">
            <span class="qp-title">Hızlı Yapıştır</span>
            <button id="qp-close" class="qp-close" title="Kapat (Esc)" aria-label="Kapat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="qp-list" class="qp-list">
            <!-- Items injected by quickpaste.js -->
        </div>
    </div>
    <script src="quickpaste.js"></script>
</body>

</html>
