# TAURI sürüm derlemesi — Electron'un `release.yml`'inden AYRI TUTULUR.
#
# İkisi de aynı depoda yaşıyor ve birbirine dokunmuyor: Electron `v*` etiketiyle
# (ör. v3.0.0), Tauri ise `tauri-v*` etiketiyle (ör. tauri-v3.0.0) tetikleniyor.
# `tauri-v3.0.0` `v*` desenine UYMUYOR (v ile başlamıyor), dolayısıyla Electron işi
# bu etikette KOŞMAZ; tersi de geçerli. Böylece Electron'un ürettiği asset'ler
# hiç bozulmadan kalıyor, Tauri kendi GitHub sürümünü ayrıca oluşturuyor.
#
# Sürüm çıkarma:
#   Electron  →  git tag v3.0.0        && git push origin v3.0.0
#   Tauri     →  git tag tauri-v3.0.0  && git push origin tauri-v3.0.0
name: Build and Release (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - 'tauri-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Electron sürümünde `max-parallel: 1` gerekiyordu: iki paralel
      # `electron-builder --publish always` işi aynı etiket için taslak yarışına girip
      # AYRI taslaklar yaratabiliyordu. `tauri-action` aynı taslağa güvenle eklediği
      # için matris artık paralel koşabiliyor.
      fail-fast: false
      matrix:
        include:
          # macOS: yalnız Apple Silicon (arm64). Intel ŞİMDİLİK YOK.
          #
          # Intel'in iki bağımsız engeli var ve ikisi birbirini kesiyor:
          #   1) Ayrı Intel runner'ı (macos-15-intel) macOS 15 SDK'da kaldı —
          #      GitHub'ın SON Intel imajı bu, daha yenisi gelmeyecek. Ama
          #      screencapturekit → apple-metal 0.8.8 Swift köprüsü macOS 26 SDK
          #      sembolleri istiyor (MTLSamplerReductionMode / reductionMode /
          #      lodBias) → Intel runner'da DERLENMİYOR.
          #   2) Alternatif "ARM runner'da universal" de çöküyor: tesseract-rs
          #      native kütüphaneyi HOST mimarisinde derliyor (x86_64 için bile
          #      arm64/NEON nesne üretiyor), universal'in x86_64 dilimi
          #      LİNKLENEMİYOR (yerelde doğrulandı).
          #
          # Sonuç: bugün güvenilir tek kombinasyon arm64 + Windows. Intel
          # kullanıcıları şimdilik Electron sürümünü (main) kullanır. Intel Tauri
          # için ya tesseract-rs çapraz-derlemeyi düzeltmeli ya da macOS 26 SDK'lı
          # bir Intel runner çıkmalı.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      # tesseract-rs, Tesseract + Leptonica'yı KAYNAKTAN derliyor. Önbelleksiz ilk
      # derleme uzun sürüyor; bu önbellek onu ~3 dakikaya indiriyor.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # cmake tesseract-rs'in ön koşulu. GitHub imajlarında hazır gelir;
      # kontrol, bir imaj değişikliğinin sessizce derlemeyi bozmasını engelliyor.
      - name: cmake doğrula
        run: cmake --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── GÜNCELLEYİCİ ŞİMDİLİK KAPALI ────────────────────────────────────
          # `bundle.createUpdaterArtifacts` false (tauri.conf.json). Sebebi:
          # tauri.conf'ta `pubkey` boş, yani güncelleyici zaten atıl (imzalasa da
          # doğrulayamaz). Açıkken her build sonunda imza anahtarı istiyordu ve
          # "Missing comment in secret key" ile düşüyordu — .dmg/.exe üretiliyor ama
          # yayınlanamıyordu. Kapalıyken installer'lar temiz yayınlanıyor.
          #
          # GÜNCELLEYİCİYİ AÇMAK İÇİN: `npm run tauri signer generate` ile anahtar
          # çifti üret → pubkey'i tauri.conf.json'a yaz → createUpdaterArtifacts'ı
          # true yap → TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) secret'larını ekle
          # (özel anahtar ASLA depoya girmez) → aşağıda includeUpdaterJson: true.
          #
          # ── macOS İMZA: ad-hoc (Developer ID YOK) ───────────────────────────
          # Yeni kurulumlarda TCC izinlerinin (Ekran Kaydı vb.) güncellemeler arası
          # KORUNMASI için kararlı bir imza kimliği gerekir; ad-hoc her build'de
          # değiştiği için izin sıfırlanır. Kalıcı çözüm ayrı bir iş (Apple
          # Developer ID + notarization); alındığında COPYBOARD_ALLOW_UNSIGNED'ı SİL,
          # APPLE_CERTIFICATE / _PASSWORD / APPLE_SIGNING_IDENTITY (+ APPLE_ID /
          # APPLE_PASSWORD / APPLE_TEAM_ID) secret'larını ekle. Electron tarafı da
          # bugün imzasız; bu, iki tarafın ortak eksiği.
          COPYBOARD_ALLOW_UNSIGNED: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CopyBoard ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
