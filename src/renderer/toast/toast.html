<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';">
    <style>
        :root {
            --bg: #1e1e2e;
            --accent: #8957e5;
            --success: #50fa7b;
            --info: #8be9fd;
            --error: #ff5555;
            --warning: #f1fa8c;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: transparent;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        .toast {
            background: var(--bg);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 200px;
            max-width: 360px;
            position: relative;
            overflow: hidden;
        }

        .toast.show {
            transform: translateX(0);
        }

        .icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .icon svg {
            width: 18px;
            height: 18px;
        }

        .success .icon {
            color: var(--success);
        }

        .info .icon {
            color: var(--info);
        }

        .error .icon {
            color: var(--error);
        }

        .warning .icon {
            color: var(--warning);
        }

        #message {
            word-break: break-word;
        }

        .progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--accent);
            width: 100%;
            border-radius: 0 0 12px 12px;
        }
    </style>
</head>

<body>
    <div id="toast" class="toast">
        <span id="icon" class="icon"></span>
        <span id="message"></span>
        <div id="progress" class="progress"></div>
    </div>

    <script src="toast.js"></script>
</body>

</html>
