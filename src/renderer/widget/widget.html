<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyBoard Widget</title>
    <link rel="stylesheet" href="widget.css">
</head>

<body>
    <div id="history-panel" class="history-panel">
        <div class="panel-tabs">
            <button class="tab-btn active" id="tab-history">Geçmiş</button>
            <button class="tab-btn" id="tab-favorites">⭐ Favoriler</button>
        </div>
        <div class="search-container">
            <input type="text" id="widget-search" placeholder="Ara..." autocomplete="off">
        </div>
        <div id="history-items" class="history-items">
            <!-- Items will be injected -->
        </div>
    </div>
    <div id="widget-container" class="widget-container">
        <!-- Main Icon -->
        <div id="widget-main" class="widget-btn main-btn">
            <svg viewBox="0 0 24 24" fill="none" class="main-icon">
                <rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <!-- Menu Items (Hidden by default) -->
        <div id="widget-menu" class="widget-menu">
            <button class="widget-btn menu-item" id="btn-snippet" title="Pano Geçmişi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-screenshot" title="Ekran Yakala">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="4 7 4 4 7 4"></polyline>
                    <polyline points="17 4 20 4 20 7"></polyline>
                    <polyline points="4 17 4 20 7 20"></polyline>
                    <polyline points="17 20 20 20 20 17"></polyline>
                    <line x1="12" y1="10" x2="12" y2="14"></line>
                    <line x1="10" y1="12" x2="14" y2="12"></line>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-ocr" title="Metin Tara (OCR)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-video" title="Video Kaydı">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
        </div>
    </div>
    <script src="widget.js"></script>
</body>

</html>
