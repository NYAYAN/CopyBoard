<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <img src="../../../icon.png" alt="CopyBoard" style="width: 24px; height: 24px; margin-right: 8px;">
                <h1>CopyBoard</h1>
            </div>
            <div class="actions">
                <button id="history-btn" class="icon-btn" title="Geçmiş" aria-label="Geçmiş">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <path d="M3 3v5h5" />
                        <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
                        <path d="M12 7v5l4 2" />
                    </svg>
                </button>
                <button id="gallery-btn" class="icon-btn" title="Ekran Görüntüleri" aria-label="Ekran Görüntüleri">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <path d="m21 15-5-5L5 21" />
                    </svg>
                </button>
                <button id="about-btn" class="icon-btn" title="Hakkında" aria-label="Hakkında">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4m0-4h.01" />
                    </svg>
                </button>
                <button id="update-btn" class="icon-btn" title="Güncellemeleri Kontrol Et" aria-label="Güncellemeleri Kontrol Et">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <path d="M1 4v6h6" />
                        <path d="M23 20v-6h-6" />
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15" />
                    </svg>
                </button>
                <button id="settings-btn" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                        <circle cx="7" cy="6" r="2" fill="currentColor" />
                        <circle cx="17" cy="12" r="2" fill="currentColor" />
                        <circle cx="7" cy="18" r="2" fill="currentColor" />
                    </svg>
                </button>
                <button id="minimize-btn" class="icon-btn" title="Gizle" aria-label="Gizle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        style="width: 16px; height: 16px;">
                        <path d="M5 12h14" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="all">Tümü</button>
            <button class="tab-btn" data-tab="favorites">Favoriler <svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;vertical-align:-1px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Geçmişte ara..." autocomplete="off">
            </div>
        </div>

        <div id="about-panel" class="settings-panel hidden">
            <div class="about-content">
                <h3 id="about-version">CopyBoard</h3>
                <p><strong>Geliştirici:</strong> Nurullah YAYAN</p>
                <p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;vertical-align:-1px;margin-right:4px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>nurullah.yayan@gmail.com</p>
            </div>
        </div>

        <div id="gallery-panel" class="settings-panel hidden">
            <div class="gallery-toolbar">
                <div class="gallery-actions-group">
                    <button id="gallery-folder-btn" title="Klasörde Göster" aria-label="Klasörde Göster">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                        </svg>
                    </button>
                    <button id="gallery-view-btn" title="Büyük Görüntüle (en yeni)" aria-label="Büyük Görüntüle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m21 21-4.3-4.3M11 8v6M8 11h6" />
                        </svg>
                    </button>
                </div>
                <div class="gallery-layout-toggle">
                    <button id="gallery-layout-1" title="Tek sütun" aria-label="Tek sütun">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="7" rx="1.5" />
                            <rect x="3" y="14" width="18" height="7" rx="1.5" />
                        </svg>
                    </button>
                    <button id="gallery-layout-2" title="İki sütun" aria-label="İki sütun">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="8" height="7" rx="1.5" />
                            <rect x="13" y="4" width="8" height="7" rx="1.5" />
                            <rect x="3" y="14" width="8" height="7" rx="1.5" />
                            <rect x="13" y="14" width="8" height="7" rx="1.5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="gallery-grid" class="gallery-grid">
                <!-- Thumbnails injected by modules/gallery.js -->
            </div>
        </div>

        <div id="settings-panel" class="settings-panel hidden">
            <div class="setting-item">
                <label for="max-items">Maksimum Kayıt:</label>
                <input style="width: 100px;" type="number" id="max-items" min="1" max="500" value="50">
            </div>
            <div class="setting-item">
                <label for="quickpaste-count">Hızlı Yapıştır Liste Sayısı:</label>
                <input style="width: 100px;" type="number" id="quickpaste-count" min="1" max="100" value="20"
                    title="Ctrl+Shift+V ile açılan hızlı yapıştır listesinde gösterilecek son kayıt sayısı">
            </div>
            <div class="setting-item">
                <label for="incognito-check">Gizli Mod (Panoyu Kaydetme):</label>
                <input type="checkbox" id="incognito-check" title="Açıkken kopyalanan metinler geçmişe kaydedilmez">
            </div>
            <div class="setting-item">
                <label for="shortcut-input">Liste Kısayolu:</label>
                <div class="shortcut-row">
                    <input type="text" id="shortcut-input" placeholder="Tuşlara basın..." readonly class="shortcut-input"
                    title="Kopyalanan verilerin listesini açmak için">
                    <input type="checkbox" id="shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="image-shortcut-input">Çizim Modu:</label>
                <div class="shortcut-row">
                    <input type="text" id="image-shortcut-input" placeholder="Tuşlara basın..." readonly
                    class="shortcut-input" title="Ekran görüntüsü alıp üzerinde çizim yapmak için">
                    <input type="checkbox" id="image-shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="ocr-shortcut-input">Metin Oku (OCR):</label>
                <div class="shortcut-row">
                    <input type="text" id="ocr-shortcut-input" placeholder="Tuşlara basın..." readonly
                    class="shortcut-input" title="Ekrandaki yazıları kopyalamak için">
                    <input type="checkbox" id="ocr-shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="color-shortcut-input">Renk Kodu Al:</label>
                <div class="shortcut-row">
                    <input type="text" id="color-shortcut-input" placeholder="Tuşlara basın..." readonly
                    class="shortcut-input" title="Ekrandaki bir pikselin renk kodunu kopyalamak için">
                    <input type="checkbox" id="color-shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="video-shortcut-input">Video Kayıt:</label>
                <div class="shortcut-row">
                    <input type="text" id="video-shortcut-input" placeholder="Tuşlara basın..." readonly
                    class="shortcut-input" title="Ekranın belirli bir bölgesini videoya kaydetmek için">
                    <input type="checkbox" id="video-shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="paste-shortcut-input">Hızlı Yapıştır:</label>
                <div class="shortcut-row">
                    <input type="text" id="paste-shortcut-input" placeholder="Tuşlara basın..." readonly
                    class="shortcut-input" title="Geçmişten seçip odaktaki alana anında yapıştırmak için. Parola alanlarında macOS klavyeyi o uygulamaya kilitler (Secure Input) ve kısayol çalışmaz — panel'i widget'taki Hızlı Yapıştır düğmesinden veya tepsi menüsünden açın.">
                    <input type="checkbox" id="paste-shortcut-enabled" class="shortcut-toggle" checked
                        title="Kısayolu aç/kapa">
                </div>
            </div>
            <div class="setting-item">
                <label for="video-quality">Video Kalitesi:</label>
                <select id="video-quality" class="settings-select">
                    <option value="low">Düşük (720p - 30fps)</option>
                    <option value="medium">Orta (1080p - 30fps)</option>
                    <option value="high" selected>Yüksek (4K - 60fps)</option>
                    <option value="ultra">Ultra (120fps)</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="autostart-check">Başlangıçta Çalıştır:</label>
                <input type="checkbox" id="autostart-check">
            </div>
            <div class="setting-item">
                <label for="widget-check">Yüzen Araç (Widget):</label>
                <input type="checkbox" id="widget-check">
            </div>
            <div id="widget-extra-settings"
                style="display: none; padding-left: 20px; flex-direction: column; gap: 8px;">
                <div class="setting-item" style="border-bottom: none; padding-bottom: 0;">
                    <label for="widget-transparent-check">Widget Saydamlığı:</label>
                    <input type="checkbox" id="widget-transparent-check">
                </div>
                <div class="setting-item" style="border-bottom: none; padding-bottom: 0;">
                    <label for="widget-color-input">Widget Rengi:</label>
                    <input type="color" id="widget-color-input" value="#8957e5">
                </div>
                <div class="setting-item" style="border-bottom: none; padding-bottom: 0;">
                    <label for="widget-opacity-input">Opaklık:</label>
                    <input type="range" id="widget-opacity-input" min="10" max="100" value="100" style="width: 100px;">
                </div>
                <div class="setting-item" style="border-bottom: none; padding-bottom: 0;">
                    <label for="widget-scale-input">Widget Boyutu:</label>
                    <input type="range" id="widget-scale-input" min="50" max="150" value="100" style="width: 100px;"
                        title="%50 ile %150 arası">
                </div>
            </div>
            <button id="clear-history-btn" class="danger-btn">Geçmişi Temizle</button>
        </div>

        <main id="history-list" class="history-list">
            <!-- Items will be injected here -->
        </main>
    </div>

    <!-- Confirm Clear Modal -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal">
            <p>Tüm geçmişi silmek istediğinizden emin misiniz?</p>
            <div class="modal-actions">
                <button id="cancel-clear-btn" class="modal-btn">Vazgeç</button>
                <button id="confirm-clear-btn" class="modal-btn danger">Sil</button>
            </div>
        </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="note-modal-title">Not</h3>
            <button id="copy-note-btn" class="note-copy-btn" title="Notu Kopyala" aria-label="Notu Kopyala">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
            </button>

            <div id="note-view-content" class="note-view hidden"></div>
            <textarea id="note-input" class="hidden" placeholder="Bu öğe için notunuzu girin..." rows="4"></textarea>

            <div class="modal-actions" id="note-view-actions">
                <button id="close-note-btn" class="modal-btn">Kapat</button>
                <button id="edit-note-btn" class="modal-btn"
                    style="background: var(--accent); color: white;">Düzenle</button>
            </div>

            <div class="modal-actions hidden" id="note-edit-actions">
                <button id="cancel-note-btn" class="modal-btn">Vazgeç</button>
                <button id="save-note-btn" class="modal-btn"
                    style="background: var(--accent); color: white;">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="../shared/render-utils.js"></script>
    <script type="module" src="renderer.js"></script>
</body>

</html>
