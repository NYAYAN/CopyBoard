[package]
name = "copyboard"
version = "3.0.0"
description = "Gelişmiş Pano Yöneticisi, Ekran Görüntüsü Aracı ve OCR Uygulaması"
authors = ["Nurullah YAYAN"]
license = "ISC"
edition = "2021"
rust-version = "1.82"

[lib]
name = "copyboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3", features = ["image-data"] }
xcap = "0.9"
log = "0.4"
# OCR. Tesseract + Leptonica'yı KAYNAKTAN derler → **cmake ön koşuldur**
# (GitHub Actions imajlarında hazır gelir). eng+tur verisi binary'ye gömülür,
# yani 9,9 MB'lık .traineddata dosyaları paketten çıkar.
tesseract-rs = { version = "0.4", features = ["build-tesseract", "embed-tessdata"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "AVError", "objc2-core-media", "AVAudioSettings", "AVAssetTrack"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime"] }
objc2-core-video = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Video kaydı ve kaydırmalı yakalama kare akışı. macOS 12.3+ (Spike-4/S4-d kararı).
screencapturekit = { version = "8", features = ["macos_15_0"] }
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    # Uyku/ekran kapanması bildirimleri (platform/windows/power.rs)
    "Win32_System_Power",
    "Win32_System_SystemServices",
    # OS açık/koyu tema tercihi (platform/windows/theme.rs)
    "Win32_System_Registry",
    # Monitör → HMONITOR (capture/recorder_win.rs, scroll_stream_win.rs)
    "Win32_Graphics_Gdi",
    # Video+ses mp4 yazımı: Media Foundation Sink Writer (capture/mf_writer.rs)
    "Win32_Media_MediaFoundation",
    # Mikrofon ve sistem sesi (loopback): WASAPI (capture/wasapi.rs)
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Performance",
    # IMMDevice::Activate, PROPVARIANT parametresi yüzünden şu iki özelliğe kapılı;
    # kapalıyken metot hiç derlenmiyor ("no method named Activate")
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Video kaydı ve kaydırmalı yakalama kare akışı: Windows.Graphics.Capture (kare) +
# Media Foundation (H.264/MP4 kodlama). macOS'taki ScreenCaptureKit'in karşılığı.
# Windows 10 1903+ ister; crate kendi `windows` 0.61'ini getiriyor (bizimki 0.62,
# iki sürüm yan yana derleniyor).
windows-capture = "1.5"

# Debug'da bağımlılıkları optimize et: Spike-3'te `image` crate'inin debug build'i
# release'ten 85 KAT yavaş çıktı (PNG encode 2890ms → 34ms). Kendi kodumuz
# optimize edilmeden kalır ki derleme hızlı olsun ve backtrace okunabilsin.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
# Menü accelerator dizgelerini tepsi menüsünün GERÇEK ayrıştırıcısına karşı doğrulamak
# için — elle kopyalanmış bir tuş listesi muda sürüm atlayınca sessizce eskir.
muda = "0.19"
