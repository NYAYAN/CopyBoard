<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyBoard Widget</title>
    <link rel="stylesheet" href="widget.css">
    <script src="../shared/theme.js"></script>
</head>

<body>
    <div id="history-panel" class="history-panel">
        <div class="panel-tabs">
            <button class="tab-btn active" id="tab-history">Geçmiş</button>
            <button class="tab-btn" id="tab-favorites">⭐ Favoriler</button>
        </div>
        <div class="search-container">
            <input type="text" id="widget-search" placeholder="Ara..." autocomplete="off">
        </div>
        <div id="history-items" class="history-items">
            <!-- Items will be injected -->
        </div>
    </div>
    <div id="widget-container" class="widget-container">
        <!-- Main Icon -->
        <div id="widget-main" class="widget-btn main-btn">
            <svg viewBox="0 0 24 24" fill="none" class="main-icon">
                <rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>

        <!-- Menu Items (Hidden by default) -->
        <div id="widget-menu" class="widget-menu">

            <button class="widget-btn menu-item" id="btn-snippet" aria-label="Pano Geçmişi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <polyline points="3 3 3 8 8 8"></polyline>
                    <line x1="12" y1="7" x2="12" y2="12"></line>
                    <line x1="12" y1="12" x2="16" y2="14"></line>
                </svg>
            </button>
            <!-- Quick Paste is not here: it lives on the global shortcut and the tray
                 menu, which is also the mouse-driven way in when macOS Secure Event
                 Input is swallowing the accelerator. -->
            <button class="widget-btn menu-item" id="btn-screenshot" aria-label="Ekran Yakala">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="6" cy="6" r="3"></circle>
                    <circle cx="6" cy="18" r="3"></circle>
                    <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                    <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                    <line x1="10.5" y1="10.5" x2="12" y2="12"></line>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-ocr" aria-label="Metin Tara (OCR)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    <path d="M17 21h2a2 2 0 0 0 2-2v-2"></path>
                    <path d="M7 3H5a2 2 0 0 0-2 2v2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M7 12h10"></path>
                    <path d="M7 8h10"></path>
                    <path d="M7 16h10"></path>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-video" aria-label="Video Kaydı">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
            <button class="widget-btn menu-item" id="btn-open-main" aria-label="Uygulamayı Aç">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
            </button>
        </div>
    </div>
    <script src="../shared/i18n.js"></script>
<script src="../shared/render-utils.js"></script>
    <script src="widget.js"></script>
</body>

</html>
